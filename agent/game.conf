# agent/game.conf - how the Developer Agent (/amp:dev) works on browsin.
# Format: one key=value per line, the first line for a key wins, the value is
# taken literally. Keys: the plugin's templates/game-repo/agent/game.conf.

# A repo whose proof is its own test suite (a plugin or a tool, not a game or a
# service): nothing is built, served or installed, and the task's QA is the full
# suite below (references/lanes/tests.md, "The tests lane").
kind=tests

# The whole suite (npm test runs it): change browsin with it green.
test=test/suite.sh

# main is the truth; the agent never pushes or deploys.
mr_target=main
